<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Privacy by construction: the page may only load its own files and talk to Open Food Facts (barcode lookups).
      No analytics, fonts, CDNs or third-party scripts can run even if someone tries to add them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://world.openfoodfacts.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="A private food diary that lives on your phone. No account, no ads, no tracking." />
    <meta name="theme-color" content="#0f7b55" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Plateful</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:24px">Plateful needs JavaScript to run. Everything stays on your device.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
